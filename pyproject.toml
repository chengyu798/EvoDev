[project]
name = "evodev"
version = "0.1.0"
description = "A LangGraph-based multi-agent software repair system."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "litellm>=1.99.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
evodev = "evodev.cli.app:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]
