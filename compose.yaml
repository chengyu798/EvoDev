services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: evodev
      POSTGRES_USER: evodev
      POSTGRES_PASSWORD: evodev
    ports:
      - "55432:5432"
    volumes:
      - evodev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evodev -d evodev"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  evodev_postgres_data:
